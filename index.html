<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique order protection (rgn2)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson@3/dist/topojson.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #F7F8FA; color: #1A1A2E;
      height: 100vh; display: flex; flex-direction: column;
    }

    /* ── 헤더 ── */
    header {
      background: #1A1A2E; color: #fff;
      padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    header .badge {
      background: #00C4CC; color: #fff; font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 4px; letter-spacing: 0.5px;
    }
    header h1 { font-size: 17px; font-weight: 700; }
    header .sub { font-size: 12px; color: #aaa; margin-left: auto; }

    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── 패널 ── */
    .panel {
      width: 300px; flex-shrink: 0; background: #fff;
      border-right: 1px solid #E5E8EE; display: flex; flex-direction: column; overflow: hidden;
    }

    /* 탭 */
    .tab-nav { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid #F0F2F5; flex-shrink: 0; }
    .tab-btn {
      padding: 8px 6px; border: none; background: #F7F8FA;
      font-size: 11px; font-weight: 600; color: #999; cursor: pointer;
      position: relative; transition: all 0.18s; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border-right: 1px solid #E5E8EE; border-bottom: 1px solid #E5E8EE;
    }
    .tab-btn:nth-child(2), .tab-btn:nth-child(4) { border-right: none; }
    .tab-btn:nth-child(3), .tab-btn:nth-child(4) { border-bottom: none; }
    .tab-btn:hover { color: #333; background: #ECEEF2; }
    .tab-btn.active {
      color: #1A1A2E; font-weight: 700; background: #fff;
      box-shadow: inset 0 -2px 0 #00C4CC;
    }

    /* 월 토글 */
    .month-wrap { padding: 10px 14px 0; }
    .month-pill {
      display: flex; background: #F0F2F5; border-radius: 20px; padding: 3px; gap: 0;
    }
    .month-btn {
      flex: 1; padding: 6px 0; border: none; background: transparent;
      border-radius: 17px; font-size: 12px; font-weight: 700; color: #999;
      cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
    }
    .month-btn.active { background: #1A1A2E; color: #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.18); }

    /* 새로고침 버튼 */
    .panel-actions { padding: 8px 14px 10px; border-bottom: 1px solid #F0F2F5; }
    .btn-refresh {
      width: 100%; padding: 9px; background: #F7F8FA; color: #555;
      border: 1px solid #D8DCE6; border-radius: 8px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
    }
    .btn-refresh:hover { background: #00C4CC; color: #fff; border-color: #00C4CC; }

    /* 범례 */
    .legend-wrap { padding: 12px 14px; border-bottom: 1px solid #F0F2F5; }
    .legend-wrap h2 {
      font-size: 11px; font-weight: 700; color: #555;
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
    }
    .legend-mode { display: flex; gap: 6px; margin-bottom: 8px; }
    .legend-mode button {
      flex: 1; padding: 4px; border: 1px solid #D8DCE6; border-radius: 5px;
      font-size: 11px; cursor: pointer; background: #F7F8FA; color: #555; transition: all 0.15s;
    }
    .legend-mode button.active { background: #1A1A2E; color: #fff; border-color: #1A1A2E; }
    canvas.legend-bar { width: 100%; height: 14px; border-radius: 7px; display: block; }
    .legend-labels {
      display: flex; justify-content: space-between; font-size: 10px; color: #999; margin-top: 3px;
    }

    /* 통계 목록 */
    .stats-wrap { padding: 12px 14px; flex: 1; overflow-y: auto; }
    .stats-wrap h2 {
      font-size: 11px; font-weight: 700; color: #555;
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 0;
    }
    .stats-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .sort-btns { display: flex; gap: 4px; }
    .sort-btn {
      font-size: 10px; padding: 3px 7px; border: 1px solid #D8DCE6;
      border-radius: 4px; background: #F7F8FA; color: #999; cursor: pointer; transition: all 0.15s;
      font-weight: 600; letter-spacing: 0.2px;
    }
    .sort-btn:hover { border-color: #00C4CC; color: #00C4CC; }
    .sort-btn.active { background: #1A1A2E; color: #fff; border-color: #1A1A2E; }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #F5F5F5; font-size: 11px;
    }
    .stat-row .rgn { color: #333; font-weight: 500; min-width: 70px; }
    .stat-row .ratio { font-weight: 700; color: #00C4CC; min-width: 40px; text-align: right; }
    .stat-row .bar-bg {
      flex: 1; height: 4px; background: #F0F2F5; border-radius: 2px; margin: 0 8px; overflow: hidden;
    }
    .stat-row .bar-fill { height: 100%; border-radius: 2px; }
    .no-data { font-size: 12px; color: #aaa; text-align: center; padding: 20px 0; }

    /* ── 지도 ── */
    .map-area { flex: 1; position: relative; overflow: hidden; background: #EEF2F7; }
    svg#map { width: 100%; height: 100%; cursor: grab; }
    svg#map:active { cursor: grabbing; }
    .region { stroke: #fff; stroke-width: 0.4; transition: opacity 0.1s; cursor: pointer; }
    .region:hover { opacity: 0.75; stroke-width: 1.0; stroke: #444; }
    .region.no-match { fill: #D8DEE9; }

    /* 툴팁 */
    #tooltip {
      position: absolute; background: rgba(26,26,46,0.95); color: #fff;
      padding: 10px 14px; border-radius: 10px; font-size: 12px;
      pointer-events: none; display: none; min-width: 155px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3); line-height: 1.8;
    }
    #tooltip .tt-name {
      font-weight: 700; font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 5px; margin-bottom: 5px;
    }
    #tooltip .tt-ratio { font-size: 22px; font-weight: 900; color: #00C4CC; line-height: 1.2; margin-bottom: 2px; }
    #tooltip .tt-row { color: #ccc; }
    #tooltip .tt-row span { color: #fff; font-weight: 600; }

    /* 매칭 카운트 */
    #match-info {
      position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.92);
      border-radius: 7px; padding: 5px 11px; font-size: 11px; color: #555;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    }
    #match-info .matched  { color: #00C4CC; font-weight: 700; }
    #match-info .unmatched { color: #FF6B6B; font-weight: 700; }

    /* ── 우측 패널 ── */
    .right-panel {
      width: 214px; flex-shrink: 0; background: #fff;
      border-left: 1px solid #E5E8EE;
      display: flex; flex-direction: column; overflow-y: auto; gap: 0;
    }
    .rp-section {
      padding: 14px 14px 10px; border-bottom: 1px solid #F0F2F5;
    }
    .rp-section:last-child { border-bottom: none; flex: 1; }
    .rp-title {
      font-size: 10px; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 10px;
    }

    /* 구간 집계 */
    #range-summary { display: none; }
    .rs-row {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 0; border-bottom: 1px solid #F7F7F7;
    }
    .rs-row:last-child { border-bottom: none; }
    .rs-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .rs-label { flex: 1; font-size: 10px; color: #555; }
    .rs-count { font-size: 11px; font-weight: 700; color: #1A1A2E; min-width: 26px; text-align: right; }
    .rs-pct   { font-size: 10px; color: #999; min-width: 34px; text-align: right; }

    /* 광역시도 바 차트 */
    #region-chart { display: none; }
    .rc-row {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 0; border-bottom: 1px solid #F7F7F7;
    }
    .rc-row:last-child { border-bottom: none; }
    .rc-name { font-size: 10px; color: #555; width: 26px; flex-shrink: 0; }
    .rc-bar-wrap {
      flex: 1; height: 6px; background: #F0F2F5; border-radius: 3px; overflow: hidden;
    }
    .rc-bar  { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
    .rc-pct  { font-size: 10px; font-weight: 700; color: #1A1A2E; min-width: 32px; text-align: right; }
    .rc-cnt  { font-size: 9px; color: #bbb; min-width: 18px; text-align: right; }

    /* 줌 버튼 */
    .zoom-btns { position: absolute; right: 14px; bottom: 20px; display: flex; flex-direction: column; gap: 4px; }
    .zoom-btns button {
      width: 30px; height: 30px; border: none; border-radius: 7px; background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: #333; transition: background 0.15s;
    }
    .zoom-btns button:hover { background: #00C4CC; color: #fff; }

    /* 로딩 */
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #EEF2F7; font-size: 13px; color: #888; flex-direction: column; gap: 12px;
    }
    .spinner {
      width: 30px; height: 30px; border: 3px solid #D8DEE9;
      border-top-color: #00C4CC; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<header>
  <div class="badge">MAP</div>
  <h1>Unique order protection (rgn2)</h1>
  <div class="sub">시/군/구 단위 · 대한민국</div>
</header>

<div class="main">
  <div class="panel">
    <div class="tab-nav">
      <button class="tab-btn active" onclick="setTab(0)">Inventory(지역) 주문</button>
      <button class="tab-btn"        onclick="setTab(1)">Inventory(지역) 파트너</button>
      <button class="tab-btn"        onclick="setTab(2)">Inventory(전국+지역) 주문</button>
      <button class="tab-btn"        onclick="setTab(3)">Inventory(전국+지역) 파트너</button>
    </div>

    <div class="month-wrap">
      <div class="month-pill">
        <button id="btn-jun" class="month-btn" onclick="setMonth('jun')">6월</button>
        <button id="btn-dec" class="month-btn active" onclick="setMonth('dec')">12월</button>
      </div>
    </div>
    <div class="panel-actions">
      <button class="btn-refresh" onclick="refreshDummy()">&#8635; 데이터 새로고침</button>
    </div>

    <div class="legend-wrap">
      <h2>색상 범례</h2>
      <div class="legend-mode">
        <button id="mode-sequential" class="active" onclick="setMode('sequential')">순차형</button>
        <button id="mode-diverging"               onclick="setMode('diverging')">분기형 (50%)</button>
      </div>
      <canvas class="legend-bar" id="legend-canvas" height="14"></canvas>
      <div class="legend-labels">
        <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
      </div>
    </div>

    <div class="stats-wrap">
      <div class="stats-header">
        <h2>지역별 순위</h2>
        <div class="sort-btns">
          <button id="sort-desc" class="sort-btn active" onclick="setSort('desc')">▼ 내림차순</button>
          <button id="sort-asc"  class="sort-btn"        onclick="setSort('asc')">▲ 오름차순</button>
        </div>
      </div>
      <div id="stats-list"><div class="no-data">데이터 로딩 중...</div></div>
    </div>
  </div>

  <div class="map-area" style="flex:1;min-width:0;">
    <div id="loading">
      <div class="spinner"></div>
      <span>지도 데이터 로딩 중...</span>
    </div>
    <svg id="map"></svg>
    <div id="tooltip"></div>
    <div id="match-info" style="display:none"></div>
    <div class="zoom-btns">
      <button onclick="zoomIn()">+</button>
      <button onclick="zoomReset()">⌂</button>
      <button onclick="zoomOut()">−</button>
    </div>
  </div>

  <div class="right-panel">
    <div class="rp-section" id="range-wrap">
      <div class="rp-title">구간별 분포</div>
      <div id="range-summary"></div>
    </div>
    <div class="rp-section" id="region-wrap">
      <div class="rp-title">광역시도별 침투율</div>
      <div id="region-chart"></div>
    </div>
  </div>
</div>

// 2. 더미 데이터 생성 (tab0: 주문 avg 25%, tab1: 파트너 avg 30%)
// ═══════════════════════════════════════════════════════════════════════════

// XorShift32 seeded RNG
function makeRng(seed) {
  let s = (seed ^ 0xDEADBEEF) >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
}

// Box-Muller → N(0,1)
function gauss(rng) {
  const u = Math.max(rng(), 1e-10);
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
}

function generateDummy(tabIdx, seed) {
  const rng       = makeRng(seed);
  const isPartner = tabIdx === 1;
  const MEAN      = isPartner ? 0.30 : 0.25;
  const STD       = 0.10;

  const map = {};
  for (const rgn of REGIONS) {
    const rural   = rgn.endsWith('군');
    const logMean = isPartner ? (rural ? 5.8 : 7.5) : (rural ? 11.3 : 13.2);
    const logStd  = rural ? 0.50 : 0.55;
    const total   = Math.max(
      Math.round(Math.exp(logMean + gauss(rng) * logStd)),
      isPartner ? 50 : 10000
    );
    const minR = rural ? 0.03 : 0.07;
    const maxR = rural ? 0.50 : 0.65;
    const rate = Math.min(Math.max(MEAN + gauss(rng) * STD, minR), maxR);
    const specific = Math.round(total * rate);
    map[rgn] = { total, specific, ratio: specific / total };
  }
  return map;
}

}

let colorMode = 'sequential';

const COLOR_SCHEMES = {
  sequential: d3.scaleSequential(d3.interpolateYlOrRd).domain([0, 1]),
  diverging:  d3.scaleDiverging(d3.interpolateBuGn).domain([0, 0.5, 1]),
};

function getColor(ratio) { return COLOR_SCHEMES[colorMode](ratio); }

function setMode(mode) {
  colorMode = mode;
  document.getElementById('mode-sequential').classList.toggle('active', mode === 'sequential');
  document.getElementById('mode-diverging').classList.toggle('active', mode === 'diverging');
  drawLegend();
  updateMapColors();
  renderRightPanel();
}

function drawLegend() {
  const canvas = document.getElementById('legend-canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth || 260;
  canvas.width = w;
  for (let i = 0; i < w; i++) {
    ctx.fillStyle = getColor(i / w);
    ctx.fillRect(i, 0, 1, 14);
  }
}

const svg = d3.select('#map');
const g   = svg.append('g');

const zoom = d3.zoom().scaleExtent([0.5, 12]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

let projection, pathGen, geoData;

function initMap(topoData) {
  geoData = topoData;
  const municipalities = topojson.feature(topoData, topoData.objects['skorea_municipalities_2018_geo']);

  const svgEl = document.getElementById('map');
  const W = svgEl.clientWidth, H = svgEl.clientHeight;

  projection = d3.geoMercator().fitExtent([[24, 24], [W - 24, H - 24]], municipalities);
  pathGen    = d3.geoPath().projection(projection);

  g.selectAll('.region')
    .data(municipalities.features)
    .join('path')
    .attr('class', 'region no-match')
    .attr('d', pathGen)
    .attr('data-name', d => d.properties.name || d.properties.NAME)
    .on('mousemove', onMouseMove)
    .on('mouseleave', onMouseLeave);

  document.getElementById('loading').style.display = 'none';
  refreshDummy(); // 더미 데이터 자동 적용
}

// 6. 지역명 매칭
// ═══════════════════════════════════════════════════════════════════════════
function normalize(s) {
  return s.trim()
    .replace(/특별시|광역시|특별자치시|특별자치도|특별자치군/g, '')
    .replace(/\s+/g, '')
    .toLowerCase();
}

function shortName(fullName) {
  const parts = fullName.trim().split(/\s+/);
  return parts[parts.length - 1];
}

function findMatch(geoName) {
  const gNorm  = normalize(geoName);
  const gShort = normalize(shortName(geoName));
  const dm     = userDataMaps[activeTab];

  for (const [k, v] of Object.entries(dm)) { if (normalize(k) === gNorm)  return v; }
  for (const [k, v] of Object.entries(dm)) { if (normalize(k) === gShort) return v; }
  for (const [k, v] of Object.entries(dm)) {
    const kn = normalize(k);
    if (gNorm.includes(kn) || kn.includes(gNorm)) return v;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════
// 7. 지도 색상 업데이트
// ═══════════════════════════════════════════════════════════════════════════
function updateMapColors() {
  if (!g) return;
  let matched = 0, unmatched = 0;

  g.selectAll('.region').each(function(d) {
    const geoName = d.properties.name || d.properties.NAME || '';
    const match = findMatch(geoName);
    const el = d3.select(this);
    if (match) {
      el.classed('no-match', false).attr('fill', getColor(ar(match)));
      matched++;
    } else {
      el.classed('no-match', true).attr('fill', null);
      unmatched++;
    }
  });

  if (Object.keys(userDataMaps[activeTab]).length > 0) {
    const info = document.getElementById('match-info');
    info.style.display = 'block';
    info.innerHTML = `매칭 <span class="matched">${matched}</span> · 미매칭 <span class="unmatched">${unmatched}</span>`;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// 8. 통계 목록
// ═══════════════════════════════════════════════════════════════════════════
function renderStats() {
  const entries = Object.entries(userDataMaps[activeTab]).sort((a, b) =>
    sortDir === 'desc' ? ar(b[1]) - ar(a[1]) : ar(a[1]) - ar(b[1])
  );
  if (!entries.length) {
    document.getElementById('stats-list').innerHTML = '<div class="no-data">데이터 없음</div>';
    return;
  }
  document.getElementById('stats-list').innerHTML = entries.map(([name, d]) => {
    const ratio = ar(d);
    const pct   = (ratio * 100).toFixed(1);
    return `
      <div class="stat-row">
        <div class="rgn">${name}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${getColor(ratio)}"></div></div>
        <div class="ratio">${pct}%</div>
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════════════════
// 9. 구간 집계 + 광역시도 바 차트
// ═══════════════════════════════════════════════════════════════════════════
const RANGE_BUCKETS = [
  { label: '20% 미만',          min: 0,   max: 0.2 },
  { label: '20%~40% 미만',      min: 0.2, max: 0.4 },
  { label: '40%~60% 미만',      min: 0.4, max: 0.6 },
  { label: '60%~80% 미만',      min: 0.6, max: 0.8 },
  { label: '80% 이상',          min: 0.8, max: Infinity },
];

function renderRangeSummary() {
  const el = document.getElementById('range-summary');
  const entries = Object.values(userDataMaps[activeTab]);
  if (!entries.length) { el.style.display = 'none'; return; }

  const total = entries.length;
  const midpoints = [0.10, 0.30, 0.50, 0.70, 0.90];
  el.style.display = 'block';
  el.innerHTML = RANGE_BUCKETS.map((b, i) => {
    const cnt = entries.filter(d => ar(d) >= b.min && ar(d) < b.max).length;
    const pct = (cnt / total * 100).toFixed(1);
    return `<div class="rs-row">
      <div class="rs-dot" style="background:${getColor(midpoints[i])}"></div>
      <div class="rs-label">${b.label}</div>
      <div class="rs-count">${cnt}개</div>
      <div class="rs-pct">${pct}%</div>
    </div>`;
  }).join('');
}

function renderRegionChart() {
  const el = document.getElementById('region-chart');
  const rollup = ROLLUP_DATA[activeTab];
  if (!rollup || !Object.keys(rollup).length) { el.style.display = 'none'; return; }

  const entries = Object.entries(rollup)
    .map(([rgn1, d]) => ({ rgn1, ...d, _ratio: ar(d) }))
    .sort((a, b) => b._ratio - a._ratio);

  const maxRatio = Math.max(...entries.map(e => e._ratio), 0.001);

  el.style.display = 'block';
  el.innerHTML = entries.map(e => {
    const pct    = (e._ratio * 100).toFixed(1);
    const barW   = (e._ratio / maxRatio * 100).toFixed(1);
    const col    = getColor(e._ratio);
    return `<div class="rc-row">
      <div class="rc-name">${e.rgn1}</div>
      <div class="rc-bar-wrap"><div class="rc-bar" style="width:${barW}%;background:${col}"></div></div>
      <div class="rc-pct">${pct}%</div>
      <div class="rc-cnt">${e.count}</div>
    </div>`;
  }).join('');
}

function renderRightPanel() {
  renderRangeSummary();
  renderRegionChart();
}

// ═══════════════════════════════════════════════════════════════════════════
// 10. 툴팁
// ═══════════════════════════════════════════════════════════════════════════
function onMouseMove(event, d) {
  const geoName = d.properties.name || d.properties.NAME || '';
  const match   = findMatch(geoName);
  const tip     = document.getElementById('tooltip');

  let inner = `<div class="tt-name">${geoName}</div>`;
  if (match) {
    const ratio    = ar(match);
    const specific = as_(match);
    const pct      = (ratio * 100).toFixed(1);

    // 12월일 때 6월 대비 델타
    let deltaHtml = '';
    if (activeMonth === 'dec' && match.jun_specific != null) {
      const delta    = match.specific - match.jun_specific;
      const deltaPct = ((match.ratio - match.jun_ratio) * 100).toFixed(1);
      const sign     = delta >= 0 ? '+' : '';
      const col      = delta >= 0 ? '#00C4CC' : '#FF6B6B';
      deltaHtml = `
        <div class="tt-row" style="margin-top:4px;border-top:1px solid rgba(255,255,255,0.12);padding-top:4px;">
          6월 대비 <span style="color:${col}">${sign}${delta.toLocaleString()}건 (${sign}${deltaPct}%p)</span>
        </div>`;
    }

    inner += `
      <div class="tt-ratio">${pct}%</div>
      <div class="tt-row">${TAB_CONFIG[activeTab].col1} <span>${match.total.toLocaleString()}</span></div>
      <div class="tt-row">${TAB_CONFIG[activeTab].col2} <span>${specific.toLocaleString()}</span></div>
      ${deltaHtml}`;
  } else {
    inner += '<div class="tt-row" style="color:#aaa">데이터 없음</div>';
  }
  tip.innerHTML = inner;

  const rect = document.querySelector('.map-area').getBoundingClientRect();
  let x = event.clientX - rect.left + 14;
  let y = event.clientY - rect.top  - 10;
  if (x + 175 > rect.width)  x -= 190;
  if (y + 110 > rect.height) y -= 110;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
  tip.style.display = 'block';
}
function onMouseLeave() { document.getElementById('tooltip').style.display = 'none'; }

// ═══════════════════════════════════════════════════════════════════════════
// 10. 줌
// ═══════════════════════════════════════════════════════════════════════════
function zoomIn()    { svg.transition().call(zoom.scaleBy, 1.5); }
function zoomOut()   { svg.transition().call(zoom.scaleBy, 0.67); }
function zoomReset() { svg.transition().call(zoom.transform, d3.zoomIdentity); }

// ═══════════════════════════════════════════════════════════════════════════
// 11. GeoJSON 로드 + 리사이즈
// ═══════════════════════════════════════════════════════════════════════════
const TOPO_URL = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-topo.json';

d3.json(TOPO_URL)
  .then(data => { initMap(data); drawLegend(); window.addEventListener('resize', drawLegend); })
  .catch(err => {
    document.getElementById('loading').innerHTML =
      `<div style="color:#FF6B6B;text-align:center;padding:20px">
        지도 로드 실패<br><small style="color:#aaa">네트워크 연결을 확인하세요<br>${err.message}</small>
      </div>`;
  });

window.addEventListener('resize', () => {
  if (!geoData) return;
  const munis = topojson.feature(geoData, geoData.objects['skorea_municipalities_2018_geo']);
  const el = document.getElementById('map');
  projection.fitExtent([[24, 24], [el.clientWidth - 24, el.clientHeight - 24]], munis);
  pathGen = d3.geoPath().projection(projection);
  g.selectAll('.region').attr('d', pathGen);
  drawLegend();
});
</script>
